version = 1

# Source-reviewed #163 candidate. Add only positively witnessed exceptions.
# Lower order is higher. Same-layer families do not require allowed peers.
[layer_policy]
peers = "forbid"
shared_outbound = "forbid"

[layers.web]
app = "trellis-web"
order = 1
paths = ["web/**"]

[layers.web-tests]
app = "trellis-web"
display = "hidden"
order = 0
paths = [
  "tests/browser/**", "tests/*-ui.test.cjs", "tests/metric-heat.test.cjs",
  "tests/treemap-pele.test.cjs",
]

[layers.entry]
app = "trellis"
order = 2
paths = [
  "src/main.rs", "src/auth.rs", "src/http.rs", "src/http/**",
  "src/daemon/**", "src/mcp/**",
]

[layers.query]
app = "trellis"
order = 3
paths = [
  "src/navigation.rs", "src/class_diagram.rs",
  "src/behavior.rs", "src/behavior_bindings.rs", "src/behavior_java.rs",
  "src/behavior_js.rs", "src/behavior_python.rs", "src/behavior_rust.rs",
  "src/dependencies.rs", "src/dependency_links.rs", "src/dependency_rust.rs",
  "src/dependency_rust_symbols.rs", "src/file_tree.rs", 
  "src/git_status.rs", "src/metrics.rs", "src/references.rs", "src/references/**",
  "src/rules.rs", "src/rust_sources.rs", "src/search_embed/**",
  "src/search_model.rs", "src/search_rank.rs",
  "src/architecture_details.rs", "src/behavior_incidental.rs",
  "src/graph_query.rs", "src/rules/**", "src/rules_edit.rs", "src/behavior_columns.rs",
  "src/apps.rs", "src/apps/**", "src/interfaces.rs", "src/interfaces/**",
  "src/model_management.rs", "src/search_config.rs", "src/symbol_lookup.rs",
]

[layers.indexing]
app = "trellis"
order = 4
paths = [
  "src/indexer.rs", "src/indexer_java.rs", "src/indexer_python.rs", "src/indexer_rust.rs",
  "src/indexer_ts.rs",
  # A tree-sitter extractor run at capture time, plus the persisted Catalog record (#998).
  "src/classes.rs", "src/classes/**",
  "src/index_coordinator.rs", "src/index_coordinator/**", "src/capture.rs", "src/watch.rs",
  "src/native_evidence.rs", "src/native_capture.rs",
  "src/scip_admission.rs", "src/semantic_evidence.rs", "src/semantic_import.rs",
  "src/search_capture.rs", "src/search_card.rs",
  "src/native_rust_macros_tests.rs", "src/extractor_inputs_tests.rs", "src/indexer_projection_vectors_tests.rs",
  "src/semantic_import_complexity_tests.rs", "src/native_rust_macros.rs", "src/producer/**", "src/evidence_budget.rs", "src/semantic_batch.rs", "src/semantic_batch/**",
  "src/semantic_import/**",
  "src/language_set_tests.rs", "src/native_typescript_tests.rs", "src/semantic_join_inputs_tests.rs",
]

[layers.storage]
app = "trellis"
order = 5
paths = ["src/store.rs", "src/store/**", "src/search_vectors.rs", "src/sqlite_config.rs"]

[layers.shared]
apps = ["trellis"]
shared = true
paths = [
  "src/model.rs", "src/testing.rs", "src/native_ids.rs", "src/scip_raw.rs", "src/files_view.rs", "src/parallel.rs", "src/build_info.rs", "src/search_lexical.rs",
  "src/lib.rs", "src/scip_raw/**", "src/test_alloc.rs", "src/syntax_bounds.rs", "src/heap.rs",
  # Leaf constants, small types and pure helpers that storage and shared code use (S1, #999).
  # They reference no layer: the skipped-input placeholders, the batch resource policy with
  # its counters and generated-batch origin, and the vocabulary moved out of indexing and query.
  "src/skipped_config.rs", "src/skipped_source.rs",
  "src/semantic_batch/limits.rs", "src/semantic_batch/counters.rs", "src/semantic_batch/origin.rs",
  "src/evidence_limits.rs", "src/diagnostic_markers.rs", "src/diagnostic_markers_tests.rs",
  "src/scip_vocab.rs", "src/jsonc.rs", "src/source_dir.rs", "src/process_info.rs",
  # The stored search-card records and their eligibility predicate (S1b, #1000).
  "src/search_card_records.rs",
]

# Coarse developer-tool boundary; does not infer internal tooling architecture.
[layers.tooling]
app = "trellis"
display = "hidden"
order = 1
paths = [
  "tools/*.py", "tools/*.mjs", "src/bin/**", "src/native_navigation_fixture.rs", "tools/release/**",
  "tools/semantic-contract/**", "tools/extraction/**", "tools/selection/**",
  "tools/metrics-oracle/**", "tools/metrics-bench/**", "tools/semantic-search/**",
  "tools/synthetic-cohorts/generate.mjs", "tools/synthetic-cohorts/test/**",
  "docs/semantic-evidence/check-policy.mjs", "docs/semantic-evidence/id-test-vectors/**",
  "build.rs", "build/**", "examples/**",
]

# --- app "trellis-herdr-mod" (herdr-mod/package.json): the Herdr app mod (#707, #909).
# Three layers by import direction (#998): the view, the adapters over the shared web
# scripts and the daemon client, and the DOM and runtime stand-ins they run on.
[layers.herdr-mod-tests]
app = "trellis-herdr-mod"
display = "hidden"
order = 0
paths = ["herdr-mod/test/**"]

[layers.herdr-mod-tooling]
app = "trellis-herdr-mod"
display = "hidden"
order = 1
paths = ["herdr-mod/build.mjs", "herdr-mod/web-plugin.mjs", "herdr-mod/web-scripts.mjs"]

[layers.herdr-ui]
app = "trellis-herdr-mod"
order = 2
paths = ["herdr-mod/src/main.js", "herdr-mod/src/architecture-ui.js", "herdr-mod/src/panels.js"]

[layers.herdr-adapters]
app = "trellis-herdr-mod"
order = 3
paths = ["herdr-mod/src/diagram.js", "herdr-mod/src/sequence.js", "herdr-mod/src/client.js"]

[layers.herdr-platform]
app = "trellis-herdr-mod"
order = 4
paths = ["herdr-mod/src/runtime.js", "herdr-mod/src/dom.js"]

# Captured sample programs are inputs, not Trellis runtime implementations.
[layers.fixture-inputs]
app = "trellis"
display = "hidden"
order = 0
paths = ["tests/fixtures/**", "tools/synthetic-cohorts/templates/**"]

# Test harnesses sit above the helpers they share and above tooling (#998).
[layers.mcp-tests]
app = "trellis"
display = "hidden"
order = 0
paths = ["tests/mcp/**", "tests/mcp-*.test.mjs"]

[layers.tests]
app = "trellis"
display = "hidden"
order = 0
paths = ["tests/**"]

[layers.test-support]
app = "trellis"
display = "hidden"
order = 1
paths = ["tests/common/**", "tests/support/**"]
