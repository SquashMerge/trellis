[package]
name = "trellis"
version = "0.1.0"
edition = "2024"
description = "Local diagram-first code index and daemon"
license = "BUSL-1.1"
publish = false

[features]
default = []
test-support = []
metal = ["candle-core/metal", "candle-nn/metal"]

[dependencies]
anyhow = "1"
axum = "0.8"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
clap = { version = "4", features = ["derive"] }
directories = "6"
hex = "0.4"
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
ignore = "0.4"
globset = "0.4"
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
libc = "0.2"
notify = "8"
protobuf = "3"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.40", features = ["bundled", "blob"] }
scip = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.27"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
uuid = { version = "1", features = ["v4"] }

[[example]]
name = "semantic_search_parity"
required-features = ["test-support"]

[build-dependencies]
# build.rs hashes the native extraction inputs (build/extractor_inputs.rs).
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Debug-profile speed for the verify suite. Only codegen optimization changes:
# debug assertions, overflow checks and debuginfo keep their dev defaults.
# Dependencies (sqlite, tree-sitter grammars, sha2, serde_json, ...) build once
# and are cached, so optimize them fully.
[profile.dev]
# Line tables keep file:line in panics and backtraces while cutting debug-build
# compile and link time for the many test binaries (CI already builds this way).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# Light optimization of the crate itself makes its heavy indexing and publish
# tests several times faster for a modest rebuild cost.
[profile.dev.package.trellis]
opt-level = 1
