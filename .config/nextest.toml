[profile.default]
# A hung test fails the run after five minutes instead of stalling it.
slow-timeout = { period = "60s", terminate-after = 5 }

# Real-worker unit tests and MCP protocol fixtures start daemon worker loops
# with bounded liveness waits. CPU-default test parallelism can run dozens of
# these daemons at once, far beyond normal local use. Share the existing cap;
# deadlines and assertions are unchanged. This limits tests, not all processes.
[test-groups]
real-workers = { max-threads = 4 }
# Real producers run one at a time: they are heavy and share host toolchains.
producer-e2e = { max-threads = 1 }

[[profile.default.overrides]]
filter = '(kind(lib) & test(/^(http::(exceptional_recovery_tests|live_tests)|daemon::registry::selection_tests)::/)) | (binary_id(trellis::mcp) & test(/^mcp_protocol::/))'
test-group = 'real-workers'

[[profile.default.overrides]]
filter = 'binary_id(trellis::producer) & test(/^producer_e2e(_java|_rust)?::/)'
test-group = 'producer-e2e'

# The nightly runs each generated-history property at 256 cases in one test. On
# a GitHub runner these take from about 3 to 12 minutes, and the same test can
# take nearly twice as long on a slower runner (#874), so the default
# five-minute backstop would act as a speed limit. Give them a 30-minute hang
# backstop, well inside the job's 90 minutes; every other test keeps the default.
[[profile.nightly.overrides]]
filter = 'binary_id(=trellis::semantic) & (test(=semantic_batch_store::proptest_retention::decision_0006_multi_slot_histories) | test(=proptest_native_first::native_first_generated_histories) | test(/^proptest_native_first::native_first_reduced_limit_histories_/) | test(=proptest_witness_rejoin::local_rejoin_matches_full_on_generated_histories)) | binary_id(=trellis::http) & test(=architecture_cache_properties::generated_cache_histories)'
slow-timeout = { period = "60s", terminate-after = 30 }

# tools/stress (the stress workflow) runs the suite under CPU load. Each
# repetition's JUnit report names the failed tests and keeps their output.
# Everything else, including the test groups above, comes from the default.
[profile.stress.junit]
path = "junit.xml"

# The stress workflow's deep property pass (tools/stress --proptest-cases)
# reruns the property tests at a much higher case count (#757). One generated
# test then runs many histories, so its hang backstop is two hours.
[profile.deep]
slow-timeout = { period = "60s", terminate-after = 120 }

[profile.deep.junit]
path = "junit.xml"
