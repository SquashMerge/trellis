[profile.default]
# A hung test fails the run after five minutes instead of stalling it.
slow-timeout = { period = "60s", terminate-after = 5 }

# Unit tests that run real daemon worker loops (20 ms queue and maintenance
# ticks on blocking threads) and bound their liveness waits at 5-10 s. Run
# alongside every other test, dozens of these daemons compete for CPU far
# beyond the 2-3 processes Trellis is designed for, and those waits time out.
# Cap how many run at once; deadlines and assertions are unchanged (#138
# replaces the polling workers).
[test-groups]
real-workers = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'kind(lib) & test(/^(http::(exceptional_recovery_tests|live_tests)|daemon::registry::selection_tests)::/)'
test-group = 'real-workers'
