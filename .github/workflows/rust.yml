name: Rust foundation
# One run per commit: pull requests run on their merge ref; pushes run only
# for the long-lived branches (a PR branch would otherwise run twice).
on:
  push:
    branches: [main, "feature-*", "feature/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix runtime/acp --ignore-scripts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The synthetic-cohorts composition helper builds its tree-sitter grammars
      # in its own target directory under the OS temp dir; cache it with the
      # main workspace's dependencies.
      - name: Locate composition helper target
        run: |
          target=$(node -p 'require("node:path").join(require("node:os").tmpdir(), "trellis-synthetic-composition-cargo-target")')
          echo "COMPOSITION_TARGET=$target" >> "$GITHUB_ENV"
          echo "TRELLIS_COMPOSITION_TARGET=$target" >> "$GITHUB_ENV"
      # verify runs the Rust tests with nextest (one process per test).
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      # verify builds two target directories: the default build (`target`) and
      # the test-support build (`target-test-support`), which is the larger.
      # Caches are saved only from pushes to the long-lived branches, so a pull
      # request restores its base branch's warm cache and never evicts it
      # (GitHub scopes a PR's cache reads to its own, base and default branch).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            . -> target-test-support
          cache-directories: ${{ env.COMPOSITION_TARGET }}
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature-') || startsWith(github.ref, 'refs/heads/feature/')) }}
      - run: npm ci --prefix tests/browser --ignore-scripts
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
      - name: Install Playwright Chromium with system dependencies
        if: runner.os == 'Linux'
        run: node tests/browser/node_modules/playwright/cli.js install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
      - name: Install Playwright Chromium
        if: runner.os == 'macOS'
        run: node tests/browser/node_modules/playwright/cli.js install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
      # verify lints the default build and runs the tests once, with test-support hooks.
      - run: ./tools/verify
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
