name: Rust foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # CI-only: line tables keep file:line in panics and backtraces while
      # cutting debug-build compile and link time.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix runtime/acp --ignore-scripts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The synthetic-cohorts composition helper builds its tree-sitter grammars
      # in its own target directory under the OS temp dir; cache it with the
      # main workspace's dependencies.
      - name: Locate composition helper target
        run: echo "COMPOSITION_TARGET=$(node -p 'require("node:path").join(require("node:os").tmpdir(), "trellis-synthetic-composition-cargo-target")')" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-directories: ${{ env.COMPOSITION_TARGET }}
      - run: npm ci --prefix tests/browser --ignore-scripts
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
      - name: Install Playwright Chromium with system dependencies
        if: runner.os == 'Linux'
        run: node tests/browser/node_modules/playwright/cli.js install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
      - name: Install Playwright Chromium
        if: runner.os == 'macOS'
        run: node tests/browser/node_modules/playwright/cli.js install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
      # verify builds default targets and a separate feature-enabled binary/test lane.
      - run: ./tools/verify
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
