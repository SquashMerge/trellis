name: Stress tests
# The Rust tests under CPU load, repeated, so flaky-test classes (timing
# assumptions, missing settled waits, unbounded waits) show up here before they
# reach a release PR (#720). It never gates a PR: there is no pull_request
# trigger and it is not a required check. A failure files nothing; a human or
# supervisor triages the uploaded logs. See docs/releases.md#stress-lane.
on:
  schedule:
    # Weekly, Sunday 06:23 UTC.
    - cron: '23 6 * * 0'
  workflow_dispatch:
    inputs:
      repeat:
        description: Repetitions of the suite per runner (0 = only the deep property pass)
        default: '3'
        type: string
      proptest_cases:
        description: Cases per property in the deep property pass (0 = no deep pass)
        default: '1024'
        type: string
      load:
        description: Busy loops per core, running for the whole suite (0 = none)
        default: '2'
        type: string
      test_threads:
        description: nextest test threads (empty = one per core)
        default: ''
        type: string
      filter:
        description: Optional nextest filterset, e.g. test(watcher) (empty = the whole suite)
        default: ''
        type: string
      os:
        description: Runners
        default: both
        type: choice
        options: [both, macos-latest, ubuntu-latest]
permissions:
  contents: read
concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # The job id and cache key match rust.yml's tests job, so this restores the
  # tests job's warm cache from main. It never saves one.
  verify:
    name: stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'macos-latest' && '["macos-latest"]' || inputs.os == 'ubuntu-latest' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      # The setup below is rust.yml's, for its tests job: the same toolchain,
      # linker, nextest and cache, so this builds exactly what CI builds.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix tests/mcp --ignore-scripts
      # Keep in step with rust-toolchain.toml and rust.yml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-mold
      - uses: ./.github/actions/install-nextest
      - id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tests
          workspaces: . -> target-test-support
          save-if: false
      # Builds first, then runs the suite under load REPEAT times and writes a
      # per-test, per-repetition failure summary to the job summary.
      - name: Run the tests under load
        id: stress
        if: ${{ (inputs.repeat || '3') != '0' }}
        env:
          REPEAT: ${{ inputs.repeat || '3' }}
          LOAD: ${{ inputs.load || '2' }}
          TEST_THREADS: ${{ inputs.test_threads }}
          FILTER: ${{ inputs.filter }}
        run: |
          set -- --repeat "$REPEAT" --load "$LOAD"
          if [ -n "$TEST_THREADS" ]; then set -- "$@" --test-threads "$TEST_THREADS"; fi
          if [ -n "$FILTER" ]; then set -- "$@" -- -E "$FILTER"; fi
          ./tools/stress "$@"
      # Each repetition's full nextest log and JUnit report (which keeps every
      # failed test's output), plus the summary.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: stress-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: target-test-support/stress/
          retention-days: 14
          if-no-files-found: warn
      # The curated property tests once more, without load, at PROPTEST_CASES
      # cases each (#757), even when a repetition above failed. The seed is the
      # run ID, so a failure can be replayed with PROPTEST_RNG_SEED.
      - name: Deep property pass
        id: deep
        if: ${{ !cancelled() && steps.cache.outcome == 'success' && (inputs.proptest_cases || '1024') != '0' }}
        env:
          PROPTEST_CASES: ${{ inputs.proptest_cases || '1024' }}
          TEST_THREADS: ${{ inputs.test_threads }}
          SEED: ${{ github.run_id }}
        run: |
          set -- --repeat 0 --proptest-cases "$PROPTEST_CASES" --proptest-seed "$SEED" --out target-test-support/stress-deep
          if [ -n "$TEST_THREADS" ]; then set -- "$@" --test-threads "$TEST_THREADS"; fi
          ./tools/stress "$@"
      # The deep pass's log, JUnit report, seed and the proptest regression files.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.deep.outcome == 'failure' }}
        with:
          name: proptest-deep-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: target-test-support/stress-deep/
          retention-days: 14
          if-no-files-found: warn
