name: Nightly property tests

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TRELLIS_PROPTEST_CASES: 256
      PROPTEST_RNG_SEED: ${{ github.run_id }}
      TRELLIS_RETENTION_TRACE: 1
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: ./.github/actions/setup-mold
      - uses: ./.github/actions/install-nextest
      - name: Run curated properties
        run: >-
          cargo nextest run --profile nightly --locked --features test-support --no-fail-fast --test index --test semantic --test http --test scip_decoding_properties
          -E 'binary(index) & (test(proptest_absence::) | test(proptest_java_absence::) | test(proptest_python_absence::) | test(proptest_rust_absence::)) | binary(semantic) & (test(proptest_witness_rejoin::) | test(proptest_retention::) | test(proptest_native_first::)) | binary(http) & (test(architecture_cache_properties::) | test(architecture_precompute::concurrent_readers_wait_for_one_build) | test(architecture_precompute::a_rules_edit_during_a_build_is_built_next)) | binary(scip_decoding_properties)'

  report:
    if: ${{ always() && needs.deep.result == 'failure' }}
    needs: deep
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Nightly property tests failed';
            const {owner, repo} = context.repo;
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `The curated deep property run failed at ${context.sha}.\n\n[Run logs](${url})`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', per_page: 100});
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({owner, repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner, repo, title, body});
            }
